plugins {
	id 'net.neoforged.moddev' version '1.0.21'
	id 'maven-publish'
}

version = "${project.minecraft_version}-${project.mod_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	maven { url 'https://maven.neoforged.net/releases' }
	maven { url 'https://maven.parchmentmc.org' }
	maven { url 'https://jitpack.io' }
}

neoForge {
	version = project.neoforge_version

	parchment {
		minecraftVersion = project.minecraft_version
		mappingsVersion = project.parchment_version
	}

	accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')

	runs {
		client {
			client()
		}
	}

	mods {
		cosmetica {
			sourceSet sourceSets.main
		}
	}
}

tasks.processResources {
	inputs.property 'version', project.version

	filesMatching('META-INF/neoforge.mods.toml') {
		expand version: project.version
	}
}

dependencies {
	implementation "com.github.Cosmetica-cc:CosmeticaDotJava:${project.cosmetica_dot_java_version}"
	jarJar "com.github.Cosmetica-cc:CosmeticaDotJava:${project.cosmetica_dot_java_version}"

	compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 21
}

java {
	withSourcesJar()
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifact jar
			artifact sourcesJar
		}
	}
	repositories {
		maven { url 'https://jitpack.io' }
	}
}
